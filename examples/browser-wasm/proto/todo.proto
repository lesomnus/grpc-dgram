syntax = "proto3";

package todo;

option go_package = "github.com/lesomnus/grpc-dgram/examples/browser-wasm/todopb";

// TodoService is an ordinary gRPC service — the kind a project's UI is built
// against, and nothing in its implementation is browser-specific. That is what
// lets it be compiled to js/wasm and served inside the page it answers, where
// a reload restarts it.
service TodoService {
  rpc List(ListRequest) returns (ListResponse) {}
  rpc Add(AddRequest) returns (Task) {}
  rpc Toggle(ToggleRequest) returns (Task) {}
  rpc Remove(RemoveRequest) returns (RemoveResponse) {}

  // Watch streams every mutation until the client goes away. It is what makes
  // the page a subscriber rather than a poller — and the part of a UI that is
  // most tedious to fake by hand, which is the point of running the real
  // server in the page.
  rpc Watch(WatchRequest) returns (stream Event) {}
}

message Task {
  uint32 id = 1;
  string title = 2;
  bool done = 3;
}

message ListRequest {}

message ListResponse {
  repeated Task tasks = 1;
  // The server's own name for itself — "the js/wasm build". It says which
  // build answered, not how the caller reached it, and the page renders what
  // it was told rather than what it assumes about the server it started.
  string served_by = 2;
}

message AddRequest {
  string title = 1;
}

message ToggleRequest {
  uint32 id = 1;
}

message RemoveRequest {
  uint32 id = 1;
}

message RemoveResponse {
  uint32 id = 1;
}

message WatchRequest {}

message Event {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_ADDED = 1;
    KIND_CHANGED = 2;
    KIND_REMOVED = 3;
  }

  Kind kind = 1;
  Task task = 2;
}
