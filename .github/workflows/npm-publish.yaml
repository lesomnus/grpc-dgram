name: npm publish

# Publishes ts/ to npm by trusted publishing — npm's GitHub Actions OIDC
# exchange — so no token lives in this repository. Three things make it work:
#   - npmjs.com lists this workflow as the package's trusted publisher
#     (package settings → Trusted Publisher → GitHub Actions: owner lesomnus,
#     repository grpc-dgram, workflow filename npm-publish.yaml, no environment);
#   - the job has `id-token: write`, and its npm is ≥ 11.5.1 on Node ≥ 22;
#   - the tag names the version in ts/package.json (ts-v0.1.0 ↔ 0.1.0), so a
#     publish is always of the commit the tag pins, with provenance attached
#     automatically.
# Deprecating an old version is not a publish and is done by hand (npmjs.com,
# or `npm deprecate` after `npm login`).

on:
  push:
    tags:
      - 'ts-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: The tag names the version in package.json
        run: |
          want="${GITHUB_REF_NAME#ts-v}"
          have="$(node -p "require('./package.json').version")"
          if [ "$want" != "$have" ]; then
            echo "tag ts-v$want, but ts/package.json says $have" >&2
            exit 1
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Test (incl. Go↔TS conformance)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: npm ≥ 11.5.1 (trusted publishing needs it)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Publish
        run: npm publish
