name: CI

on:
  pull_request:
    paths: &paths
      - "**/*.go"
      - "**/*.proto"
      - ".github/workflows/ci.yaml"
      - "**/go.mod"
      - "**/go.sum"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "ts/**"
      - "conformance/**"
      # The examples are documentation that compiles, and one of them (the
      # browser-wasm page) is JavaScript and HTML this workflow type-checks.
      - "examples/**"
  push:
    paths: *paths

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Lint protos
        run: buf lint

      # The repo is a workspace: the root module plus one module per adapter
      # that carries third-party deps. ./... does not cross module boundaries,
      # so vet/test iterate over every go.mod.
      - name: Vet
        run: |
          for d in $(find . -name go.mod -not -path '*/.*' -printf '%h\n' | sort); do
            (cd "$d" && go vet ./...)
          done

      - name: Test
        run: |
          for d in $(find . -name go.mod -not -path '*/.*' -printf '%h\n' | sort); do
            (cd "$d" && go test -race -timeout 120s -count=1 ./...)
          done

      # transport/jsport and conformance/wasmserver are //go:build js && wasm,
      # so every command above skipped them without a word — that is what the
      # tag buys, and it is also how they would rot unnoticed. GOOS=js pulls
      # them in; the test runs under the runner's node through the toolchain's
      # own exec wrapper (no -race: the wasm port has no race detector).
      - name: Test (js/wasm)
        run: |
          GOOS=js GOARCH=wasm go build ./...
          GOOS=js GOARCH=wasm go test -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" -count=1 ./transport/jsport/...
          # The example's in-page server is its own module, so ./... above does
          # not reach it — and it is the whole point of that example.
          (cd examples/browser-wasm && GOOS=js GOARCH=wasm go build ./...)

      - name: Fuzz smoke
        run: |
          go test -run '^$' -fuzz '^FuzzServerHandle$' -fuzztime 20s .
          go test -run '^$' -fuzz '^FuzzConnHandle$' -fuzztime 20s .

  bench:
    runs-on: ubuntu-latest
    # The old commit is checked out INSIDE the current tree, so Go's walk-up
    # would find a workspace file left in the working directory. go.work is
    # untracked, but a self-hosted or cached runner can still have one.
    env:
      GOWORK: off

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Lookup last successful commit
        id: last-success
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WF_REF="${{ github.workflow_ref }}"
          FILENAME=$(basename "${WF_REF%%@*}")
          gh run list \
            --workflow=$FILENAME \
            --status=success \
            --limit=1 \
            --json headSha \
            --jq '.[0].headSha' > sha

          SHA="$(tr -d '\n' < sha)"
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid commit hash from gh run list: '$SHA'" >&2
            exit 1
          fi

          echo "LAST_SUCCESS=$SHA" >> $GITHUB_ENV

      - name: Checkout last successful commit
        if: steps.last-success.outcome == 'success'
        uses: actions/checkout@v6
        with:
          ref: ${{ env.LAST_SUCCESS }}
          path: old

      - name: Run benchmark on last successful commit
        if: steps.last-success.outcome == 'success'
        run: |
          cd old
          go mod download
          go test -bench=. -benchmem -count=10 -run='^$' . > "../old-${LAST_SUCCESS}.txt"

      - name: Run benchmark on current
        if: steps.last-success.outcome == 'success'
        run: |
          go test -bench=. -benchmem -count=10 -run='^$' . > "new-${GITHUB_SHA}.txt"

      - name: Install benchstat
        if: steps.last-success.outcome == 'success'
        run: |
          go install golang.org/x/perf/cmd/benchstat@latest

      - name: Compare
        if: steps.last-success.outcome == 'success'
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          benchstat \
            "old-${LAST_SUCCESS}.txt" \
            "new-${GITHUB_SHA}.txt" \
            | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # The TypeScript port (ts/). Runs typecheck, the vitest suite, and the build.
  # Go is set up because the cross-language tests build and drive a real Go
  # server: conformance/udpserver over loopback UDP
  # (ts/test/conformance.test.ts), and conformance/wasmserver built for
  # GOOS=js GOARCH=wasm and loaded into the test process (ts/test/wasm.test.ts).
  # Both skip themselves when `go` is absent, but CI wants them exercised.
  ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Test (incl. Go↔TS conformance)
        run: pnpm test

      - name: Build
        run: pnpm build

      # The browser examples' pages are plain ES modules checked against the
      # port's own .d.mts output, which only exists after the build above.
      # Nothing else compiles them, and a page that stopped type-checking is a
      # page that stopped working.
      - name: Typecheck the example pages
        run: |
          pnpm exec tsc -p ../examples/browser-webrtc
          pnpm exec tsc -p ../examples/browser-wasm
