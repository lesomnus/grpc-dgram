# Regenerate the protobuf-es fixtures used by the protobuf-es / conformance / Connect tests:
#   pnpm gen   (== buf generate ../proto --template buf.gen.yaml)
# Uses @bufbuild/protoc-gen-es against the same proto/ the Go module uses.
version: v2
plugins:
  - local: protoc-gen-es
    out: src/testing/gen
    opt:
      - target=ts
      - import_extension=js
