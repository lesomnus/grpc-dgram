edition = "2023";

package drpc;

import "drpc/metadata.proto";
import "google/protobuf/duration.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/grpc-dgram;drpc";

// Frame is the unit of the drpc protocol. See PROTOCOL.md §5.
//
// Flags (bitmask on `flags`):
//   1 = OPEN  — creates the call; client→server only; seq MUST be 1.
//   2 = CLOSE — sender's direction finished; with `code` it is terminal.
//   4 = RESET — stateless "no such call"; `epoch` echoes the offending frame.
//   8 = PING  — sid 0: peer keepalive; sid≠0: stream probe.
message Frame {
  // Sender's incarnation nonce, chosen at random per Conn/Server instance.
  // Exception: RESET frames echo the epoch of the frame they answer.
  fixed32 epoch = 1;

  // Stream id, client-allocated, starting at 1, never reused within an
  // epoch. 0 is reserved for peer-scope control frames (PING).
  fixed32 sid = 2;

  // Per-stream, per-direction sequence, starting at 1.
  // Stateless frames (RESET, PING) carry 0.
  fixed32 seq = 3;

  // Flag bitmask; see message comment.
  uint32 flags = 4;

  // Full method name (e.g. "/echo.EchoService/Once"); OPEN frames only,
  // where it MUST be present — methods are addressed by string, always.
  string method = 5;

  // Field 6 carried a learned method index; removed pre-release (a stale
  // index could silently dispatch the wrong method across a different-build
  // server restart, and the savings were negligible for stream workloads).
  reserved 6;
  reserved method_index;

  // Codec name; OPEN frames only; "" means proto.
  string codec = 7;

  // Remaining call budget at send time; OPEN frames only.
  google.protobuf.Duration timeout = 8;

  // One marshaled message. Presence is meaningful: a flag-less frame WITH
  // payload is a data frame (even when the message marshals to 0 bytes);
  // WITHOUT payload it is a header frame.
  bytes payload = 9 [features.field_presence = EXPLICIT];

  // gRPC status code; meaningful only on CLOSE frames, where presence
  // distinguishes terminal CLOSE (code set) from half-close (unset).
  // See https://grpc.io/docs/guides/status-codes/.
  uint32 code = 10 [features.field_presence = EXPLICIT];

  // Status description.
  string desc = 11;

  Metadata header = 12;
  Metadata trailer = 13;

  // The client incarnation this frame addresses (PROTOCOL.md §6.1).
  // Server→client call frames (H, data, T, stream probes, keepalive) echo the
  // client epoch of the call they belong to; the client accepts a frame into
  // a stream only when this names its own epoch — a sid alone does not,
  // because a restarted client re-allocates sids from 1. A client→server
  // RESET echoes the offending frame's peer_epoch so the server can reset
  // exactly that incarnation's call. Client→server call frames leave it 0
  // (their field 1 already names the incarnation).
  fixed32 peer_epoch = 14;
}
